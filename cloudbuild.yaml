# Google Cloud Build configuration for Banking Backend
steps:
  # Step 1: Build the Maven application
  - name: 'maven:3.9.5-openjdk-17'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'backend'

  # Step 2: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/banking-backend:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/banking-backend:latest',
      'backend'
    ]

  # Step 3: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/banking-backend:latest']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'banking-backend',
      '--image=gcr.io/$PROJECT_ID/banking-backend:latest',
      '--platform=managed',
      '--region=us-central1',
      '--allow-unauthenticated',
      '--port=8080',
      '--memory=1Gi',
      '--cpu=1',
      '--min-instances=0',
      '--max-instances=10',
      '--timeout=300',
      '--add-cloudsql-instances=$PROJECT_ID:us-central1:banking-db',
      '--set-env-vars=DATABASE_URL=jdbc:postgresql:///banking_app?cloudSqlInstance=$PROJECT_ID:us-central1:banking-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory',
      '--set-env-vars=DATABASE_USERNAME=banking_user',
      '--set-env-vars=DATABASE_PASSWORD=$$DATABASE_PASSWORD',
      '--set-env-vars=SPRING_PROFILES_ACTIVE=prod'
    ]
    secretEnv: ['DATABASE_PASSWORD']

# Substitute the database password from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/database-password/versions/latest
    env: 'DATABASE_PASSWORD'

# Configure build options
options:
  substitution_option: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY

# Images to be stored in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/banking-backend:latest'