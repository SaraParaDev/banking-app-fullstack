spring:
  datasource:
    # For Cloud Run, use Cloud SQL Auth Proxy or direct connection
    url: ${DATABASE_URL:jdbc:postgresql://34.68.6.208:5432/banking_app?connectTimeout=30&socketTimeout=30}
    username: ${DATABASE_USERNAME:banking_user}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      platform: postgresql
      continue-on-error: false

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    com.example.banking: DEBUG
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
